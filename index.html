<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>For You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Poppins',sans-serif;background:#080010;color:#fff;user-select:none;}
canvas#particles{position:fixed;inset:0;z-index:0;pointer-events:none;}
body::before{content:'';position:fixed;inset:0;z-index:-1;
  background:linear-gradient(135deg,#0a0010 0%,#1a0525 30%,#10001a 60%,#0d0018 100%);
  background-size:300% 300%;animation:bgShift 14s ease infinite;}
@keyframes bgShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
body::after{content:'';position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.6) 100%);}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:10;transition:opacity 1.4s ease,transform 1.4s ease;}
.screen.hidden{opacity:0;pointer-events:none;transform:scale(1.04);}

#question-screen .title{font-family:'Great Vibes',cursive;font-size:clamp(2.8rem,8vw,5.5rem);
  color:#ff4a7d;text-shadow:0 0 40px rgba(255,74,125,.4),0 0 80px rgba(255,74,125,.15);
  margin-bottom:3rem;animation:titleGlow 4s ease-in-out infinite;}
@keyframes titleGlow{0%,100%{text-shadow:0 0 40px rgba(255,74,125,.4)}50%{text-shadow:0 0 60px rgba(255,74,125,.6),0 0 100px rgba(255,74,125,.3)}}
.btn-row{display:flex;gap:1.5rem;flex-wrap:wrap;justify-content:center;}
.btn-love{padding:1rem 3rem;font-size:1.2rem;font-family:'Poppins',sans-serif;font-weight:600;
  border:2px solid rgba(255,107,157,.5);border-radius:50px;background:rgba(255,45,85,.1);
  color:#ff6b9d;cursor:pointer;transition:all .4s cubic-bezier(.4,0,.2,1);backdrop-filter:blur(10px);}
.btn-love:hover{transform:translateY(-3px) scale(1.05);border-color:#ff2d55;color:#fff;
  box-shadow:0 10px 40px rgba(255,45,85,.35),0 0 60px rgba(255,45,85,.12);background:rgba(255,45,85,.25);}
.btn-love:active{transform:scale(.97);}
.subtitle{font-size:.8rem;color:rgba(255,255,255,.25);margin-top:2rem;letter-spacing:2px;animation:fadeIn 3s ease 1s both;}

/* big intro */
#big-love{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:30;
  pointer-events:none;opacity:0;transition:opacity 1s ease;}
#big-love span{font-family:'Great Vibes',cursive;font-size:clamp(4rem,14vw,10rem);
  color:#ff2d55;text-shadow:0 0 40px rgba(255,45,85,.7),0 0 80px rgba(255,45,85,.35),0 0 120px rgba(255,45,85,.15);
  transform:scale(.7);transition:transform 1.2s cubic-bezier(.4,0,.2,1),opacity 1s ease;}
#big-love.show{opacity:1;}
#big-love.show span{transform:scale(1);}
#big-love.fade span{transform:scale(1.15);opacity:0;transition:transform 1.2s ease,opacity 1s ease;}

/* main */
#main-screen{z-index:5;}
#heart-wrap{position:relative;width:min(96vw,90vh);height:min(96vw,90vh);margin:auto;
  transition:transform 4s cubic-bezier(.4,0,.2,1);}

/* heart texts */
#heart-texts{position:absolute;inset:0;z-index:6;}
.heart-text{position:absolute;font-family:'Great Vibes',cursive;color:#ff6b9d;white-space:nowrap;
  opacity:0;transform:translate(-50%,-50%) scale(0);pointer-events:none;
  text-shadow:0 0 10px rgba(255,107,157,.9),0 0 25px rgba(255,45,85,.6),0 0 50px rgba(255,45,85,.25);}
.heart-text.show{opacity:1;transform:translate(-50%,-50%) scale(1);
  transition:opacity .9s ease,transform .9s cubic-bezier(.34,1.56,.64,1);}
.heart-text.wave{animation:colorWave 2.5s ease-in-out infinite;}
@keyframes colorWave{0%,100%{color:#ff6b9d;text-shadow:0 0 10px rgba(255,107,157,.9),0 0 25px rgba(255,45,85,.6)}
  33%{color:#ff2d55;text-shadow:0 0 15px rgba(255,45,85,1),0 0 35px rgba(255,45,85,.7)}
  66%{color:#ffd700;text-shadow:0 0 15px rgba(255,215,0,.8),0 0 35px rgba(255,215,0,.4)}}

/* photos */
#photo-container{position:absolute;inset:6%;z-index:3;clip-path:url(#heartClip);}
.photo-item{position:absolute;border-radius:8px;overflow:hidden;opacity:0;
  transform:scale(0) rotate(10deg);box-shadow:0 4px 25px rgba(0,0,0,.7);
  transition:opacity .6s cubic-bezier(.2,0,.2,1),transform .6s cubic-bezier(.17,.89,.32,1.25);}
.photo-item.show{opacity:1;transform:scale(1) rotate(var(--rot,0deg));}
#ph15{transition:opacity .5s cubic-bezier(.2,0,.2,1),transform .5s cubic-bezier(.17,.89,.32,1.35) !important;}
.photo-item.float{animation:photoFloat 4s ease-in-out infinite;}
.photo-item.fly{transform:scale(5) !important;opacity:0 !important;
  transition:transform .8s cubic-bezier(.3,0,.7,1),opacity .6s ease !important;pointer-events:none;z-index:40;}
#ph15.fly{transform:scale(2.5) !important;transition:transform 1.2s ease,opacity 1s ease .2s !important;}
.photo-item img{width:100%;height:100%;object-fit:cover;display:block;}
@keyframes photoFloat{0%,100%{transform:scale(1) rotate(var(--rot,0deg)) translateY(0)}
  50%{transform:scale(1) rotate(var(--rot,0deg)) translateY(-4px)}}

/* love on photos */
.photo-love{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.4);
  font-family:'Great Vibes',cursive;font-size:clamp(.7rem,1.8vw,1.3rem);
  color:#fff;text-shadow:0 0 10px rgba(255,45,85,.9),0 0 20px rgba(255,45,85,.5);
  opacity:0;animation:fadeIn .5s ease forwards;}

/* love fill inside heart */
.heart-love-fill{position:absolute;font-family:'Great Vibes',cursive;color:#ff2d55;white-space:nowrap;
  pointer-events:none;z-index:4;opacity:0;
  text-shadow:0 0 8px rgba(255,45,85,.9),0 0 25px rgba(255,45,85,.5),0 0 45px rgba(255,45,85,.2);
  animation:loveFillCycle 2.5s ease forwards;}
@keyframes loveFillCycle{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}
  25%{opacity:.85;transform:translate(-50%,-50%) scale(1)}
  75%{opacity:.7;transform:translate(-50%,-50%) scale(1.05)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.15)}}

/* big center message after photos */
#heart-center-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  z-index:5;pointer-events:none;}
#heart-center-msg::before{content:'';position:absolute;width:80%;height:50%;
  background:radial-gradient(ellipse,rgba(8,0,16,.85) 0%,rgba(8,0,16,.4) 50%,transparent 75%);
  border-radius:50%;opacity:0;transition:opacity 1.2s ease;}
#heart-center-msg.active::before{opacity:1;}
#heart-center-msg span{font-family:'Great Vibes',cursive;font-size:clamp(3rem,9vw,6rem);
  color:#fff;opacity:0;position:relative;
  text-shadow:0 0 15px rgba(255,45,85,1),0 0 40px rgba(255,45,85,.7),0 0 80px rgba(255,45,85,.3);
  transition:opacity 1s ease;}
#heart-center-msg span.show{opacity:1;}

/* neon from heart */
.neon-love{position:fixed;font-family:'Great Vibes',cursive;pointer-events:none;z-index:25;
  opacity:0;animation:neonFly 2.5s ease-out forwards;}
@keyframes neonFly{0%{opacity:0;transform:translate(0,0) scale(.3)}
  15%{opacity:1;transform:translate(0,0) scale(1)}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4)}}

/* glow */
.glow-overlay{position:fixed;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(circle at center,rgba(255,45,85,.06) 0%,transparent 55%);
  opacity:0;transition:opacity 3s ease;}
.glow-overlay.show{opacity:1;animation:glowBreath 4s ease-in-out infinite;}
.glow-overlay.intense{background:radial-gradient(circle at center,rgba(255,45,85,.15) 0%,rgba(255,20,80,.04) 40%,transparent 65%);}
@keyframes glowBreath{0%,100%{opacity:.5}50%{opacity:1}}

/* finale */
#finale{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:35;pointer-events:none;opacity:0;transition:opacity 1.5s ease;
  background:radial-gradient(ellipse at center,rgba(8,0,16,.85) 0%,rgba(8,0,16,.95) 100%);}
#finale.show{opacity:1;}
.finale-line{font-family:'Great Vibes',cursive;font-size:clamp(1.5rem,4.5vw,3rem);
  color:#ffd4e0;text-shadow:0 0 20px rgba(255,107,157,.5),0 0 40px rgba(255,45,85,.2);
  opacity:0;transform:translateY(25px);margin:.35em 0;
  transition:opacity 1.2s ease,transform 1.2s ease;}
.finale-line.show{opacity:1;transform:translateY(0);}
.finale-line.big{font-size:clamp(2rem,6.5vw,4.2rem);color:#ff6b9d;
  text-shadow:0 0 30px rgba(255,107,157,.6),0 0 60px rgba(255,45,85,.3);}

/* repeat */
#repeat-screen .title{font-family:'Great Vibes',cursive;font-size:clamp(2.5rem,7vw,5rem);
  color:#ff6b9d;text-shadow:0 0 40px rgba(255,107,157,.4);margin-bottom:2.5rem;}

.petal{position:fixed;pointer-events:none;z-index:28;
  background:radial-gradient(circle at 30% 30%,#ff6b9d,#cc1144);
  border-radius:50% 0 50% 50%;animation:petalDrift linear forwards;}
@keyframes petalDrift{0%{transform:rotate(0) translateX(0);opacity:.7}
  25%{transform:rotate(80deg) translateX(25px)}50%{transform:rotate(170deg) translateX(-18px);opacity:.5}
  75%{transform:rotate(260deg) translateX(20px)}100%{transform:rotate(360deg) translateX(0);opacity:0;top:105vh}}

.twinkle{position:fixed;width:3px;height:3px;border-radius:50%;background:#fff;pointer-events:none;z-index:27;
  animation:twinkleAnim ease-in-out infinite alternate;}
@keyframes twinkleAnim{0%{opacity:.1;transform:scale(.5)}100%{opacity:.9;transform:scale(1.3)}}

/* SVG heart drawing around finale text */
#finale-heart{position:absolute;width:92%;height:92%;top:4%;left:4%;pointer-events:none;}
.draw-heart{fill:none;stroke:#ff6b9d;stroke-width:1.5;stroke-linecap:round;
  stroke-dasharray:1500;stroke-dashoffset:1500;
  filter:drop-shadow(0 0 6px rgba(255,107,157,.7)) drop-shadow(0 0 12px rgba(255,45,85,.3));
  transition:stroke-dashoffset 4s ease-in-out;}
.draw-heart.animate{stroke-dashoffset:0;}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media(max-width:600px){.btn-love{padding:.8rem 2rem;font-size:1rem;}#heart-wrap{width:98vw;height:98vw;}}
</style>
</head>
<body>
<canvas id="particles"></canvas>
<div class="glow-overlay" id="glow"></div>
<svg width="0" height="0" style="position:absolute"><defs>
  <clipPath id="heartClip" clipPathUnits="objectBoundingBox">
    <path d="M0.5,0.92 C0.5,0.92 0.01,0.62 0.01,0.33 C0.01,0.12 0.22,0.01 0.5,0.28 C0.78,0.01 0.99,0.12 0.99,0.33 C0.99,0.62 0.5,0.92 0.5,0.92Z"/>
  </clipPath>
</defs></svg>
<audio id="music" src="1.mp3" preload="auto"></audio>

<div id="big-love"><span>I Love You</span></div>

<section class="screen" id="question-screen">
  <h1 class="title">Do you love me?</h1>
  <div class="btn-row">
    <button class="btn-love" onclick="go()">Yes</button>
    <button class="btn-love" onclick="go()">Yes</button>
  </div>
  <p class="subtitle">there is only one answer</p>
</section>

<section class="screen hidden" id="main-screen">
  <div id="heart-wrap">
    <div id="heart-texts"></div>
    <div id="heart-center-msg"><span></span></div>
    <div id="photo-container" style="clip-path:url(#heartClip)"></div>
  </div>
</section>

<div id="finale">
  <svg id="finale-heart" viewBox="0 0 600 520">
    <path class="draw-heart" d="M300,460 C300,460 15,280 15,155 C15,55 110,5 300,135 C490,5 585,55 585,155 C585,280 300,460 300,460Z"/>
  </svg>
  <div class="finale-line" id="fl1">Ты — мечта, ставшая реальностью...</div>
  <div class="finale-line" id="fl2">Я засыпаю и просыпаюсь с мыслями о тебе</div>
  <div class="finale-line" id="fl3">Ты — всё, о чём я мечтал всю жизнь</div>
  <div class="finale-line big" id="fl4">Люблю тебя... бесконечно ♥</div>
</div>

<section class="screen hidden" id="repeat-screen">
  <h1 class="title">Repeat?</h1>
  <div class="btn-row">
    <button class="btn-love" onclick="restart()">Yes</button>
    <button class="btn-love" onclick="restart()">Yes</button>
  </div>
</section>

<script>
const HEART_N=48, HT_START=3500, HT_INT=140;
const PH_START=9500, PH_INT=400, PH15_EXTRA=0;
const LOVE_PH=17000, FIN_START=20000, TXT_START=30000, REP_START=52000;

/* photos: safe positions, bigger, overlapping */
const PL=[
  {l:15,t:18,w:22,h:15,r:-3},   // 1 left bump
  {l:63,t:18,w:22,h:15,r:3},    // 2 right bump
  {l:10,t:30,w:22,h:15,r:-2},   // 3 moved in
  {l:34,t:27,w:24,h:17,r:0},    // 4
  {l:68,t:30,w:22,h:15,r:2},    // 5 moved in
  {l:14,t:43,w:20,h:14,r:3},    // 6 moved in
  {l:30,t:41,w:19,h:13,r:-2},   // 7
  {l:52,t:41,w:19,h:13,r:2},    // 8
  {l:66,t:43,w:20,h:14,r:-3},   // 9 moved in
  {l:20,t:55,w:18,h:13,r:2},    // 10
  {l:40,t:53,w:18,h:13,r:-1},   // 11
  {l:60,t:55,w:18,h:13,r:-2},   // 12
  {l:31,t:65,w:16,h:11,r:1},    // 13
  {l:53,t:65,w:16,h:11,r:-1},   // 14
  {l:31,t:35,w:36,h:22,r:0},    // 15
];

let on=false;const music=document.getElementById('music');
const T=[],I=[];
function s(fn,d){T.push(setTimeout(fn,d));}

// performance tier
const isMob=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
const isWeak=isMob||innerWidth<1200;
const MAX_PTS=isMob?80:isWeak?120:200;
const P=isMob?.35:isWeak?.6:1; // perf multiplier

/* ═══ PARTICLES ═══ */
const cvs=document.getElementById('particles'),ctx=cvs.getContext('2d');
let pts=[];let mx=-9e3,my=-9e3;
function rz(){cvs.width=innerWidth;cvs.height=innerHeight;}
addEventListener('resize',rz);rz();
// rebuild heart texts on resize (F11 fix)
let _rzT;addEventListener('resize',()=>{clearTimeout(_rzT);_rzT=setTimeout(()=>{
  if(!on)return;const c=document.getElementById('heart-texts');
  const had=c.querySelectorAll('.heart-text.show').length;
  const waved=c.querySelector('.heart-text.wave');
  c.innerHTML='';buildT();
  if(had>=HEART_N){c.querySelectorAll('.heart-text').forEach((e,i)=>{
    e.classList.add('show');
    if(waved){e.style.animationDelay=(i*.08)+'s';e.classList.add('wave');}
  });}
},250);});
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
document.addEventListener('click',e=>{if(!on)return;
  const n=Math.ceil(6*P);
  for(let i=0;i<n;i++)ap('heart',e.clientX+(Math.random()-.5)*50,e.clientY+(Math.random()-.5)*50);});

function ap(t,x,y){if(pts.length>=MAX_PTS)return;
  pts.push({t,x:x??Math.random()*cvs.width,y:y??(cvs.height+20),
  vx:(Math.random()-.5)*(t==='sparkle'?3:1.2),vy:t==='heart'?-(Math.random()*1.5+.5):-(Math.random()*2.5+.5),
  sz:t==='heart'?Math.random()*7+4:Math.random()*2.5+1,
  op:Math.random()*.5+.3,rot:Math.random()*6.28,rs:(Math.random()-.5)*.04,
  life:1,decay:t==='heart'?.002+Math.random()*.003:.01+Math.random()*.01,
  hue:Math.random()*60+320});}

let spkOn=false,spkR=0;
function tick(){
  ctx.clearRect(0,0,cvs.width,cvs.height);
  if(Math.random()<.04*P)ap('heart');
  if(spkOn&&Math.random()<spkR*P)ap('sparkle',Math.random()*cvs.width,Math.random()*cvs.height);
  if(on&&!isMob&&Math.random()<.25)ap('sparkle',mx+(Math.random()-.5)*25,my+(Math.random()-.5)*25);
  for(let i=pts.length-1;i>=0;i--){
    const p=pts[i];p.x+=p.vx;p.y+=p.vy;p.rot+=p.rs;p.life-=p.decay;p.vx+=(Math.random()-.5)*.08;
    if(p.life<=0||p.y<-30){pts.splice(i,1);continue;}
    ctx.save();ctx.globalAlpha=p.op*p.life;
    if(p.t==='heart'){
      ctx.translate(p.x,p.y);ctx.rotate(p.rot);const sc=p.sz/15;ctx.scale(sc,sc);
      ctx.beginPath();ctx.moveTo(0,-4);ctx.bezierCurveTo(-8,-14,-18,-4,0,10);
      ctx.moveTo(0,-4);ctx.bezierCurveTo(8,-14,18,-4,0,10);
      ctx.fillStyle=`hsla(${p.hue},80%,65%,1)`;ctx.fill();
    }else{
      ctx.fillStyle=`hsla(${p.hue},100%,75%,1)`;
      ctx.beginPath();ctx.arc(p.x,p.y,p.sz,0,6.28);ctx.fill();
    }
    ctx.restore();
  }
  requestAnimationFrame(tick);
}
tick();

/* ═══ HEART MATH ═══ */
function hp(t,sc,cx,cy){
  return{x:cx+16*Math.pow(Math.sin(t),3)*sc,
         y:cy-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*sc};}

/* ═══ BUILD ═══ */
function buildT(){
  const c=document.getElementById('heart-texts'),w=document.getElementById('heart-wrap');
  const W=w.offsetWidth,H=w.offsetHeight,sc=W/36,cx=W/2,cy=H*.44;
  const ph=['I love you','I ♥ U','Te amo','Je t\'aime','I love you','♥','Я люблю тебя','I love you'];
  const sz=[18,21,17,19,23,28,16,22];
  for(let i=0;i<HEART_N;i++){
    const pt=hp((i/HEART_N)*Math.PI*2,sc,cx,cy);
    const e=document.createElement('span');e.className='heart-text';
    e.textContent=ph[i%ph.length];
    e.style.cssText=`left:${pt.x}px;top:${pt.y}px;font-size:${sz[i%sz.length]}px;`;
    c.appendChild(e);
  }
}
function buildP(){
  const c=document.getElementById('photo-container');
  for(let i=0;i<15;i++){
    const cf=PL[i],d=document.createElement('div');
    d.className='photo-item';d.id='ph'+(i+1);
    d.style.cssText=`left:${cf.l}%;top:${cf.t}%;width:${cf.w}%;height:${cf.h}%;--rot:${cf.r}deg;z-index:${i+1};`;
    const img=document.createElement('img');img.src='photo/'+(i+1)+'.jpg';img.alt='';
    d.appendChild(img);c.appendChild(d);
  }
}

/* ═══ NEON FROM HEART ═══ */
function neon(){
  const els=document.querySelectorAll('.heart-text.show');if(!els.length)return;
  for(let n=0;n<2;n++){
    const src=els[Math.floor(Math.random()*els.length)];
    const r=src.getBoundingClientRect(),cx=innerWidth/2,cy=innerHeight/2;
    const ang=Math.atan2(r.top-cy,r.left-cx);
    const inward=Math.random()<.4;
    const flyAng=inward?ang+Math.PI:ang;
    const dist=inward?(60+Math.random()*120):(120+Math.random()*280);
    const el=document.createElement('div');el.className='neon-love';el.textContent='I love you';
    const sz=Math.random()*.6+.6;
    const cols=['#ff2d55','#ff00dd','#ff6b9d','#ffd700','#ff4081','#da70d6'];
    const col=cols[Math.floor(Math.random()*cols.length)];
    el.style.cssText=`left:${r.left}px;top:${r.top}px;font-size:${sz}rem;color:${col};
      text-shadow:0 0 5px ${col},0 0 12px ${col},0 0 25px ${col};
      --dx:${Math.cos(flyAng)*dist}px;--dy:${Math.sin(flyAng)*dist}px;`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),3000);
  }
}

/* ═══ PETALS / STARS ═══ */
function petal(){
  const p=document.createElement('div');p.className='petal';const sz=Math.random()*10+8;
  p.style.cssText=`left:${Math.random()*100}vw;top:-20px;width:${sz}px;height:${sz}px;
    animation-duration:${Math.random()*4+5}s;opacity:${Math.random()*.4+.3};`;
  document.body.appendChild(p);setTimeout(()=>p.remove(),10000);
}
function stars(n){for(let i=0;i<n;i++){
  const e=document.createElement('div');e.className='twinkle';
  e.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;
    animation-duration:${Math.random()*2+1.5}s;animation-delay:${Math.random()*2}s;
    width:${Math.random()*2+1.5}px;height:${Math.random()*2+1.5}px;`;
  document.body.appendChild(e);
}}

/* ═══ GO ═══ */
function go(){
  if(on)return;on=true;
  music.currentTime=0;music.play().catch(()=>{});
  document.getElementById('question-screen').classList.add('hidden');

  // big text
  s(()=>{const b=document.getElementById('big-love');b.classList.add('show');
    s(()=>b.classList.add('fade'),2000);
    s(()=>{b.classList.remove('show','fade');b.style.display='none';},3200);
  },500);

  // main screen
  s(()=>{document.getElementById('main-screen').classList.remove('hidden');buildT();buildP();},2500);

  // heart texts (slower, 140ms)
  s(()=>{
    const els=document.querySelectorAll('.heart-text');
    els.forEach((e,i)=>s(()=>e.classList.add('show'),i*HT_INT));
  },HT_START);

  // photos
  for(let i=0;i<14;i++){
    s(()=>{
      const p=document.getElementById('ph'+(i+1));p.classList.add('show');
      const r=p.getBoundingClientRect();
      for(let j=0;j<5;j++)ap('sparkle',r.left+r.width/2+(Math.random()-.5)*40,r.top+r.height/2+(Math.random()-.5)*40);
    },PH_START+i*PH_INT);
  }
  // photo 15
  s(()=>{
    const p=document.getElementById('ph15');p.classList.add('show');
    const r=p.getBoundingClientRect();
    for(let j=0;j<8;j++)ap('sparkle',r.left+r.width/2+(Math.random()-.5)*60,r.top+r.height/2+(Math.random()-.5)*60);
  },PH_START+14*PH_INT+PH15_EXTRA);

  // 17s: love on photos, FAST
  s(()=>{let d=0;for(let i=0;i<15;i++){d+=Math.max(40,160-i*10);
    s(()=>{const p=document.getElementById('ph'+(i+1));if(!p)return;
      const o=document.createElement('div');o.className='photo-love';o.textContent='I love you';p.appendChild(o);
    },d);}
  },LOVE_PH);

  // 16s: PHOTO RIPPLE WAVE
  s(()=>{
    for(let i=0;i<15;i++){
      s(()=>{
        const p=document.getElementById('ph'+(i+1));if(!p)return;
        p.style.transition='transform .3s ease';
        p.style.transform=`scale(1.15) rotate(${PL[i].r}deg)`;
        p.style.boxShadow='0 0 30px rgba(255,45,85,.6)';
        setTimeout(()=>{
          p.style.transform=`scale(1) rotate(${PL[i].r}deg)`;
          p.style.boxShadow='';
          p.style.transition='';
        },300);
      },i*120);
    }
  },16000);

  // 19s: PHOTOS FLY TOWARD CAMERA — reparent to body so they escape heart clip
  s(()=>{
    const order=[0,1,2,4,3,5,8,6,7,9,11,10,12,13,14];
    order.forEach((idx,i)=>{
      s(()=>{
        const p=document.getElementById('ph'+(idx+1));if(!p)return;
        const r=p.getBoundingClientRect();
        // sparkle burst
        for(let j=0;j<8;j++)ap('sparkle',r.left+r.width/2+(Math.random()-.5)*80,r.top+r.height/2+(Math.random()-.5)*80);
        // reparent to body at same screen position
        p.style.position='fixed';
        p.style.left=r.left+'px';p.style.top=r.top+'px';
        p.style.width=r.width+'px';p.style.height=r.height+'px';
        p.style.margin='0';p.style.zIndex='40';
        document.body.appendChild(p);
        p.offsetHeight; // force reflow
        p.classList.add('fly');
        setTimeout(()=>p.remove(),1200);
      },i*180);
    });
  },19000);

  // 20s: FINALE EFFECTS
  s(()=>{
    const hw=document.getElementById('heart-wrap');let ph=0;
    const pi=setInterval(()=>{ph+=.012;hw.style.transform=`scale(${1+Math.sin(ph)*.05})`;},32);I.push(pi);
    document.getElementById('glow').classList.add('show');
    spkOn=true;spkR=.3;
    const ni=setInterval(neon,Math.round(160/P));I.push(ni);
    const pI=setInterval(petal,Math.round(300/P));I.push(pI);
  },FIN_START);

  // 22s: color wave on heart texts
  s(()=>{
    const els=document.querySelectorAll('.heart-text.show');
    els.forEach((e,i)=>{e.style.animationDelay=(i*.08)+'s';e.classList.add('wave');});
  },22000);

  // 22s: BIG CENTER MESSAGE cycling
  let _msgI;
  s(()=>{
    const ct=document.getElementById('heart-center-msg');
    const sp=ct.querySelector('span');
    const msgs=['I Love You','You\'re My World','Forever Yours','♥'];
    ct.classList.add('active');
    sp.textContent=msgs[0];sp.classList.add('show');
    let mi=1;
    _msgI=setInterval(()=>{
      sp.classList.remove('show');
      setTimeout(()=>{sp.textContent=msgs[mi%msgs.length];sp.classList.add('show');mi++;},600);
    },2200);I.push(_msgI);
  },22000);

  // hide center msg when finale text appears
  s(()=>{
    clearInterval(_msgI);
    const ct=document.getElementById('heart-center-msg');
    ct.querySelector('span').classList.remove('show');
    ct.classList.remove('active');
  },TXT_START);

  // 22s: CONTINUOUS LOVE FILL inside heart (appear & disappear)
  s(()=>{
    const c=document.getElementById('heart-texts');
    const ph=['I love you','I ♥ U','Te amo','Люблю','Je t\'aime','Forever'];
    const hw=document.getElementById('heart-wrap');
    const fi=setInterval(()=>{
      const el=document.createElement('span');el.className='heart-love-fill';
      el.textContent=ph[Math.floor(Math.random()*ph.length)];
      const sz=Math.random()*2+1.5;
      const W=hw.offsetWidth,H=hw.offsetHeight,sc=W/36,cx=W/2,cy=H*.44;
      const t=Math.random()*Math.PI*2;
      const r=Math.random()*.6+.1;
      const hx=16*Math.pow(Math.sin(t),3)*r,hy=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*r;
      const x=cx+hx*sc,y=cy+hy*sc;
      el.style.cssText=`left:${x}px;top:${y}px;font-size:${sz}rem;`;
      c.appendChild(el);
      setTimeout(()=>el.remove(),2600);
    },Math.round(150/P));I.push(fi);
  },22000);

  // 24s: glow intensifies + stars
  s(()=>{document.getElementById('glow').classList.add('intense');stars(Math.round(30*P));},24000);

  // 26s: extra sparkle burst
  s(()=>{spkR=.6;const n=Math.round(20*P);for(let i=0;i<n;i++)ap('sparkle',Math.random()*cvs.width,Math.random()*cvs.height);},26000);

  // 27s: heart particle burst
  s(()=>{
    const cx=cvs.width/2,cy=cvs.height/2;
    const n=Math.round(50*P);
    for(let i=0;i<n;i++){
      const ang=(i/n)*Math.PI*2;
      const hx=16*Math.pow(Math.sin(ang),3);
      const hy=-(13*Math.cos(ang)-5*Math.cos(2*ang)-2*Math.cos(3*ang)-Math.cos(4*ang));
      pts.push({t:'heart',x:cx,y:cy,vx:hx*.6,vy:hy*.6,
        sz:Math.random()*7+4,op:.9,rot:0,rs:(Math.random()-.5)*.04,
        life:1,decay:.004,hue:Math.random()*40+330});
    }
    for(let i=0;i<30;i++)ap('sparkle',cx+(Math.random()-.5)*150,cy+(Math.random()-.5)*150);
  },27000);

  // 30s: Russian text + SVG heart drawing around it
  s(()=>{
    const f=document.getElementById('finale');f.classList.add('show');
    s(()=>document.querySelector('.draw-heart').classList.add('animate'),300);
    s(()=>document.getElementById('fl1').classList.add('show'),600);
    s(()=>document.getElementById('fl2').classList.add('show'),2500);
    s(()=>document.getElementById('fl3').classList.add('show'),4500);
    s(()=>document.getElementById('fl4').classList.add('show'),6500);
  },TXT_START);

  // 38s: extra sparkle + petal burst + heart particle burst
  s(()=>{
    const sn=Math.round(30*P);for(let i=0;i<sn;i++)ap('sparkle',Math.random()*cvs.width,Math.random()*cvs.height);
    const pn=Math.round(8*P);for(let i=0;i<pn;i++)petal();
    const cx=cvs.width/2,cy=cvs.height/2;
    const n=Math.round(20*P);
    for(let i=0;i<n;i++){
      const ang=(i/n)*Math.PI*2;
      const hx=16*Math.pow(Math.sin(ang),3);
      const hy=-(13*Math.cos(ang)-5*Math.cos(2*ang)-2*Math.cos(3*ang)-Math.cos(4*ang));
      pts.push({t:'heart',x:cx,y:cy,vx:hx*1,vy:hy*1,
        sz:Math.random()*6+3,op:.7,rot:0,rs:(Math.random()-.5)*.05,
        life:1,decay:.005,hue:Math.random()*50+320});
    }
  },38000);

  // 44s: another burst
  s(()=>{
    const n=Math.round(25*P);for(let i=0;i<n;i++)ap('sparkle',Math.random()*cvs.width,Math.random()*cvs.height);
    const pn=Math.round(6*P);for(let i=0;i<pn;i++)petal();
  },44000);

  // 48s: dim sparkles
  s(()=>{spkR=.15;},48000);

  // 50s: fade music out
  s(()=>{
    const fade=setInterval(()=>{
      if(music.volume>0.05){music.volume-=0.05;}
      else{music.pause();music.volume=1;clearInterval(fade);}
    },100);
  },50000);

  // 52s: repeat
  s(()=>{
    spkOn=false;I.forEach(i=>clearInterval(i));I.length=0;
    document.getElementById('main-screen').classList.add('hidden');
    document.getElementById('finale').classList.remove('show');
    document.getElementById('glow').classList.remove('show');
    document.getElementById('glow').classList.remove('intense');
    document.getElementById('heart-wrap').style.transform='';
    s(()=>document.getElementById('repeat-screen').classList.remove('hidden'),1600);
  },REP_START);
}

function restart(){
  T.forEach(t=>clearTimeout(t));T.length=0;
  I.forEach(i=>clearInterval(i));I.length=0;
  on=false;spkOn=false;spkR=0;music.pause();music.currentTime=0;music.volume=1;pts=[];
  document.getElementById('heart-texts').innerHTML='';
  document.querySelector('#heart-center-msg span').className='';
  document.getElementById('heart-center-msg').classList.remove('active');
  document.getElementById('photo-container').innerHTML='';
  document.querySelectorAll('.petal,.neon-love,.twinkle').forEach(e=>e.remove());
  document.querySelector('.draw-heart')?.classList.remove('animate');
  document.getElementById('heart-wrap').style.transform='';
  document.getElementById('finale').classList.remove('show');
  document.getElementById('glow').classList.remove('show','intense');
  ['fl1','fl2','fl3','fl4'].forEach(id=>document.getElementById(id).classList.remove('show'));
  const b=document.getElementById('big-love');b.style.display='';b.classList.remove('show','fade');
  document.getElementById('repeat-screen').classList.add('hidden');
  document.getElementById('main-screen').classList.add('hidden');
  setTimeout(()=>document.getElementById('question-screen').classList.remove('hidden'),300);
}

for(let i=1;i<=15;i++){const img=new Image();img.src='photo/'+i+'.jpg';}
</script>
